name: 매일 오후 3시 배포

# 06:00 UTC = 15:00 KST (한국 시간 오후 3시)
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:        # 급할 때 손으로 눌러서 즉시 배포

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 새 변경이 있을 때만 배포 커밋 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          LAST=$(git log --grep='\[deploy\]' -1 --pretty=%H)
          if [ -n "$LAST" ] && [ -z "$(git log $LAST..HEAD --oneline)" ]; then
            echo "지난 배포 이후 새 커밋 없음 → 배포 건너뜀"
            exit 0
          fi

          git commit --allow-empty -m "chore: 일일 배포 [deploy]"
          git push origin main
